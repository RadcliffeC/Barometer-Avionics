[package]
name = "stm32f405-baro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async embedded execution framework
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f405rg", "time-driver-tim2", "exti"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }

# Logging over SWD/JTAG debuggers (ST-Link, J-Link)
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# The MS5611 driver
ms5611-rs = "0.1.1"

[profile.release]
lto = true
opt-level = "s" # Optimize for binary size, critical for embedded targets
